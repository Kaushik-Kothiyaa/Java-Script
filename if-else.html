    <script>
        // Task 1:
            //o Write a JavaScript program to check if a number is positive, negative, or zero using an if-else statement.

        let num1 = 12 ;

        console.log("Number is : ",num1);
        
        if(num1 > 0){
            console.log(`Given ${num1} is positive ! `);
        } else if( num1 < 0){
            console.log(`Given ${num1} is negative ! `);
            
        } else {
            console.log(`Given ${num1} is Zero !`);
        }

             


    </script>
