<body>

    
    <script>
        
        
        let add = (a,b, Callback)=>{
            Callback(a+b);
        }

        let square = (a, Callback)=>{
            Callback(a*a);
        }

        add(10,20,(result)=>{
            console.log(result);
            
            square(result, (sq)=>{
            console.log(sq);
            
            });
        });

        
    </script>
</body>
