<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body id="demo" style="background-color: lightcyan;">
    
    <!-- Task 1:
        o Write a program that changes the background color of a webpage after 5 
        seconds using setTimeout().
         Task 2:
        o Create a digital clock that updates every second using setInterval(). -->
        
    
    <script>
        
        function changecolor(){
            document.getElementById("demo").style.backgroundColor="pink";
        }
        setTimeout(changecolor,5000);

        

    </script>

</body>
</html>
