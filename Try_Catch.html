<body>
    
    <!-- Task:
        o Write a JavaScript program that attempts to divide a number by zero. Use trycatchto handle the error and display an appropriate error message. -->


        <script>
            let num1 = 12;
            let num2 = 0;

            let division = num1/num2;

            try {
                console.log(division);
                
            } catch (error) {
                console.log(error);
                
                
            }
        </script>
</body>
