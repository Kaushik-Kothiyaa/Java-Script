<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>


    <script>


        // Task 2:
        //o Create a JavaScript program using a switch statement to display the day of the week based on the user input (e.g., 1 for Monday, 2 for Tuesday, etc.)

        let day = Number(prompt("Enter a Day"));

        switch (day) {
            case 1: console.log("Today is Monday");
                break;

            case 2: console.log("Today is Tuesday");
                break

            case 3: console.log("Today is Wednesday");
                break

            case 4: console.log("Today is Thursday");
                break

            case 5: console.log("Today is Friday");
                break

            case 6: console.log("Today is Saturday");
                break

            case 7: console.log("Today is Sunday");
                break;

        }


    </script>
</body>

</html>
