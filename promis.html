</html> <script>

        let myPromise = new Promise ((resolve,reject) => {
            setTimeout(()=>{
                resolve("Data loaded");
            }, 2000);
        });

        myPromise.then((res) => {
            console.log(res);
            
        });

        const add =( a,b) => {
            return new Promise((resolve,reject)=>{
                var c=a+b;
                if(c < 100){
                    resolve(c);
                } else {
                    reject("Invalid data")
                }
            })

        }

        const square = (a) =>{
            return new Promise ((resolve,reject)=>{
                resolve(a*a)
            });
        }

        add(10,20).then(result=>{
            return square(result)}).then(c=>{
                console.log(c);
                
            }).catch(error=>{
                console.log(error);
                
            })     
    
    </script>
</body>
